<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taiyaki Coffee Pour</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #d6eaf8;
      font-family: sans-serif;
    }
    canvas {
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <canvas id="taiyaki" width="500" height="700"></canvas>
  <script>
    const canvas = document.getElementById('taiyaki');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    // --- Load cup image ---
    const cupImg = new Image();
    cupImg.src = 'cup.png';
    let cupImgLoaded = false;
    cupImg.onload = () => { cupImgLoaded = true; };

    // --- Animation state ---
    const STATE = {
      WAIT_START: 0,
      POURING: 1,
      SETTLING: 2,
      WAIT_END: 3,
      RESETTING: 4,
    };

    let fillLevel = 0;
    let pourProgress = 0;
    let state = STATE.WAIT_START;
    let stateTimer = 0;
    let frame = 0;

    const FILL_SPEED = 0.0012;
    const SETTLE_SPEED = 0.02;
    const RESET_SPEED = 0.005;

    // Colors
    const MILK_COLOR = '#f5efe8';
    const ICE_COLOR = 'rgba(230, 240, 250, 0.6)';
    const ICE_HIGHLIGHT = 'rgba(255, 255, 255, 0.8)';
    const ICE_SHADOW = 'rgba(180, 195, 210, 0.5)';

    // Cup image positioning - where the cup from the image maps to on canvas
    // The cup in the image (1536x2048) occupies roughly:
    //   x: 390-820, y: 860-1790 (center ~605, ~1325)
    // We want to place it centered on canvas with the cup body spanning our target area
    const IMG_CUP_CENTER_X = 605;
    const IMG_CUP_TOP_Y = 860;
    const IMG_CUP_BOTTOM_Y = 1790;
    const IMG_CUP_WIDTH = 430;
    const IMG_CUP_HEIGHT = IMG_CUP_BOTTOM_Y - IMG_CUP_TOP_Y;

    // Target position on canvas
    const CUP_CENTER_X = W / 2;
    const CUP_TOP_Y = 220;
    const CUP_BOTTOM_Y = 590;
    const TARGET_CUP_HEIGHT = CUP_BOTTOM_Y - CUP_TOP_Y;
    const IMG_SCALE = TARGET_CUP_HEIGHT / IMG_CUP_HEIGHT;

    // Computed image draw position
    const IMG_DRAW_W = 1536 * IMG_SCALE;
    const IMG_DRAW_H = 2048 * IMG_SCALE;
    const IMG_DRAW_X = CUP_CENTER_X - IMG_CUP_CENTER_X * IMG_SCALE;
    const IMG_DRAW_Y = CUP_TOP_Y - IMG_CUP_TOP_Y * IMG_SCALE;

    const BASE_BOTTOM_Y = CUP_BOTTOM_Y + 10;

    // Cup geometry matching the drawing's shape:
    // Wide opening at top, fish face area, band, scales narrower, ridged base
    const CUP_WIDTH_TOP = 105;   // opening width (half)
    const CUP_WIDTH_FACE = 115;  // fish face area (widest, half)
    const CUP_WIDTH_SCALES = 95; // scales section (half)
    const CUP_WIDTH_BASE = 75;   // base (half)

    function cupEdgesAt(y) {
      const t = (y - CUP_TOP_Y) / (CUP_BOTTOM_Y - CUP_TOP_Y);
      let halfW;
      if (t < 0.05) {
        // rim
        halfW = CUP_WIDTH_TOP;
      } else if (t < 0.2) {
        // opening widens slightly to face
        const lt = (t - 0.05) / 0.15;
        halfW = CUP_WIDTH_TOP + (CUP_WIDTH_FACE - CUP_WIDTH_TOP) * lt;
      } else if (t < 0.42) {
        // fish face area (widest)
        halfW = CUP_WIDTH_FACE;
      } else if (t < 0.55) {
        // band/divider - transitions to scales
        const lt = (t - 0.42) / 0.13;
        halfW = CUP_WIDTH_FACE - (CUP_WIDTH_FACE - CUP_WIDTH_SCALES) * lt;
      } else if (t < 0.78) {
        // scales section
        const lt = (t - 0.55) / 0.23;
        halfW = CUP_WIDTH_SCALES - (CUP_WIDTH_SCALES - CUP_WIDTH_BASE - 5) * lt;
      } else {
        // ridged base - narrows further
        const lt = (t - 0.78) / 0.22;
        halfW = (CUP_WIDTH_BASE + 5) - 5 * lt;
      }
      return { left: CUP_CENTER_X - halfW, right: CUP_CENTER_X + halfW };
    }

    function drawCupClipPath() {
      ctx.beginPath();
      for (let y = CUP_TOP_Y; y <= CUP_BOTTOM_Y; y += 2) {
        const e = cupEdgesAt(y);
        if (y === CUP_TOP_Y) ctx.moveTo(e.left, y);
        else ctx.lineTo(e.left, y);
      }
      const botE = cupEdgesAt(CUP_BOTTOM_Y);
      ctx.quadraticCurveTo(CUP_CENTER_X, CUP_BOTTOM_Y + 10, botE.right, CUP_BOTTOM_Y);
      for (let y = CUP_BOTTOM_Y; y >= CUP_TOP_Y; y -= 2) {
        const e = cupEdgesAt(y);
        ctx.lineTo(e.right, y);
      }
      ctx.closePath();
    }

    // --- Ice cubes repositioned for the new cup shape ---
    const iceCubes = [
      { x: CUP_CENTER_X - 45, y: 560, w: 40, h: 34, rot: 0.2, bobOffset: 0 },
      { x: CUP_CENTER_X + 15, y: 565, w: 38, h: 32, rot: 0.08, bobOffset: 2.5 },
      { x: CUP_CENTER_X + 50, y: 558, w: 36, h: 32, rot: -0.15, bobOffset: 1.2 },
      { x: CUP_CENTER_X - 60, y: 520, w: 42, h: 36, rot: -0.18, bobOffset: 0.8 },
      { x: CUP_CENTER_X - 5, y: 525, w: 40, h: 35, rot: 0.1, bobOffset: 4.0 },
      { x: CUP_CENTER_X + 55, y: 515, w: 42, h: 36, rot: -0.05, bobOffset: 3.0 },
      { x: CUP_CENTER_X - 70, y: 478, w: 40, h: 34, rot: 0.12, bobOffset: 0.5 },
      { x: CUP_CENTER_X - 10, y: 475, w: 42, h: 36, rot: -0.08, bobOffset: 2.8 },
      { x: CUP_CENTER_X + 45, y: 482, w: 40, h: 34, rot: 0.07, bobOffset: 1.5 },
      { x: CUP_CENTER_X + 75, y: 480, w: 36, h: 32, rot: -0.15, bobOffset: 2.0 },
      { x: CUP_CENTER_X - 75, y: 435, w: 40, h: 34, rot: -0.1, bobOffset: 1.0 },
      { x: CUP_CENTER_X - 15, y: 430, w: 42, h: 36, rot: 0.14, bobOffset: 3.3 },
      { x: CUP_CENTER_X + 40, y: 438, w: 40, h: 34, rot: -0.06, bobOffset: 3.8 },
      { x: CUP_CENTER_X + 80, y: 433, w: 36, h: 30, rot: 0.1, bobOffset: 2.2 },
    ];

    let pouringStarted = false;

    function drawIceCube(cube) {
      ctx.save();
      let bob = 0;
      let wobbleAmt = 0;
      if (pouringStarted) {
        bob = Math.sin(frame * 0.02 + cube.bobOffset) * 3;
        wobbleAmt = Math.sin(frame * 0.015 + cube.bobOffset + 1) * 0.02;
      }
      ctx.translate(cube.x, cube.y + bob);
      ctx.rotate(cube.rot + wobbleAmt);

      ctx.beginPath();
      ctx.roundRect(-cube.w / 2, -cube.h / 2, cube.w, cube.h, 6);
      ctx.fillStyle = ICE_COLOR;
      ctx.fill();
      ctx.strokeStyle = ICE_SHADOW;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.beginPath();
      ctx.roundRect(-cube.w / 2 + 6, -cube.h / 2 + 5, cube.w * 0.45, cube.h * 0.35, 3);
      ctx.fillStyle = ICE_HIGHLIGHT;
      ctx.fill();

      ctx.beginPath();
      ctx.roundRect(cube.w * 0.05, cube.h * 0.05, cube.w * 0.25, cube.h * 0.2, 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.fill();

      ctx.restore();
    }

    // --- Liquid fill ---
    function getLiquidColor(fillLevel, y, topY, bottomY) {
      const yt = (y - topY) / (bottomY - topY);
      const gradientShift = (1 - yt) * 0.15;

      const espresso = { r: 74, g: 44, b: 23 };
      const latte = { r: 200, g: 168, b: 130 };

      const t = Math.min(1, fillLevel + gradientShift);
      const r = Math.round(espresso.r + (latte.r - espresso.r) * t);
      const g = Math.round(espresso.g + (latte.g - espresso.g) * t);
      const b = Math.round(espresso.b + (latte.b - espresso.b) * t);

      return `rgba(${r}, ${g}, ${b}, 0.85)`;
    }

    function drawLiquid() {
      ctx.save();
      drawCupClipPath();
      ctx.clip();

      const espressoBaseLevel = CUP_BOTTOM_Y - 60;
      const fullLevel = CUP_TOP_Y + 25;
      const liquidTopY = espressoBaseLevel - (espressoBaseLevel - fullLevel) * fillLevel;

      const bands = 60;
      const bandH = (CUP_BOTTOM_Y - liquidTopY) / bands;

      for (let i = 0; i < bands; i++) {
        const y = liquidTopY + i * bandH;
        const edges = cupEdgesAt(Math.min(y, CUP_BOTTOM_Y));
        ctx.fillStyle = getLiquidColor(fillLevel, y, liquidTopY, CUP_BOTTOM_Y);
        ctx.fillRect(edges.left, y, edges.right - edges.left, bandH + 1);
      }

      // Liquid surface wavelet
      const waveAmp = 3;
      const surfaceY = liquidTopY;
      const surfEdges = cupEdgesAt(surfaceY);
      ctx.beginPath();
      ctx.moveTo(surfEdges.left, surfaceY);
      for (let x = surfEdges.left; x <= surfEdges.right; x += 2) {
        const wave = Math.sin((x - surfEdges.left) * 0.05 + frame * 0.05) * waveAmp;
        ctx.lineTo(x, surfaceY + wave);
      }
      ctx.lineTo(surfEdges.right, surfaceY + 20);
      ctx.lineTo(surfEdges.left, surfaceY + 20);
      ctx.closePath();
      ctx.fillStyle = getLiquidColor(fillLevel, surfaceY, liquidTopY, CUP_BOTTOM_Y);
      ctx.fill();

      // Surface highlight
      ctx.beginPath();
      for (let x = surfEdges.left + 10; x <= surfEdges.right - 10; x += 2) {
        const wave = Math.sin((x - surfEdges.left) * 0.05 + frame * 0.05) * waveAmp;
        if (x === surfEdges.left + 10) ctx.moveTo(x, surfaceY + wave);
        else ctx.lineTo(x, surfaceY + wave);
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.restore();
    }

    // --- Draw the cup image ---
    function drawCupImage() {
      if (!cupImgLoaded) return;
      ctx.save();
      ctx.globalCompositeOperation = 'multiply';
      ctx.drawImage(cupImg, IMG_DRAW_X, IMG_DRAW_Y, IMG_DRAW_W, IMG_DRAW_H);
      ctx.restore();
    }

    // --- Milk carton ---
    function drawMilkCarton() {
      ctx.save();

      const cartonRight = W + 55;
      const cartonTop = -20;
      const cw = 147;
      const ch = 221;
      const tilt = -0.45;

      ctx.translate(cartonRight - cw / 2, cartonTop + ch / 2);
      ctx.rotate(tilt);

      ctx.fillStyle = '#f0f0f0';
      ctx.strokeStyle = '#bbb';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.roundRect(-cw / 2, -ch / 2, cw, ch, 8);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#d94a4a';
      ctx.beginPath();
      ctx.roundRect(-cw / 2, -ch / 2, cw, 82, [8, 8, 0, 0]);
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('MILK', 0, -ch / 2 + 57);

      ctx.fillStyle = '#d94a4a';
      ctx.beginPath();
      ctx.moveTo(-cw / 2, -ch / 2);
      ctx.lineTo(0, -ch / 2 - 52);
      ctx.lineTo(cw / 2, -ch / 2);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#c83a3a';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.fillStyle = '#ddd';
      ctx.beginPath();
      ctx.moveTo(-cw / 2 - 6, -ch / 2 + 6);
      ctx.lineTo(-cw / 2 - 30, -ch / 2 + 24);
      ctx.lineTo(-cw / 2 + 15, -ch / 2 + 20);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#bbb';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = 'rgba(0,0,0,0.07)';
      ctx.beginPath();
      ctx.ellipse(-24, 30, 36, 24, 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(30, 72, 27, 21, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(-15, 105, 24, 18, 0.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#d94a4a';
      ctx.beginPath();
      ctx.roundRect(-cw / 2, ch / 2 - 42, cw, 42, [0, 0, 8, 8]);
      ctx.fill();

      ctx.restore();
    }

    // --- Milk pour stream ---
    function drawMilkStream() {
      if (state !== STATE.POURING && state !== STATE.SETTLING) return;

      const startX = W - 75;
      const startY = 45;
      const endX = CUP_CENTER_X + 15;
      const espressoBaseLevel = CUP_BOTTOM_Y - 60;
      const fullLevel = CUP_TOP_Y + 25;
      const liquidTopY = espressoBaseLevel - (espressoBaseLevel - fullLevel) * fillLevel;
      const endY = Math.max(CUP_TOP_Y + 8, liquidTopY);

      ctx.save();

      const streamLen = pourProgress;

      if (streamLen > 0.01) {
        ctx.strokeStyle = MILK_COLOR;
        ctx.lineWidth = 33;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        for (let t = 0; t <= streamLen; t += 0.01) {
          const x = startX + (endX - startX) * t;
          const baseY = startY + (endY - startY) * t * t;
          const wobble = Math.sin(t * 10 + frame * 0.08) * 4 * t;
          const px = x + wobble * 0.3;
          if (t === 0) ctx.moveTo(px, baseY);
          else ctx.lineTo(px, baseY);
        }
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 15;
        ctx.beginPath();
        for (let t = 0; t <= streamLen; t += 0.01) {
          const x = startX + (endX - startX) * t;
          const baseY = startY + (endY - startY) * t * t;
          const wobble = Math.sin(t * 10 + frame * 0.08) * 4 * t;
          const px = x + wobble * 0.3;
          if (t === 0) ctx.moveTo(px, baseY);
          else ctx.lineTo(px, baseY);
        }
        ctx.stroke();

        ctx.strokeStyle = 'rgba(200, 190, 175, 0.4)';
        ctx.lineWidth = 38;
        ctx.beginPath();
        for (let t = 0; t <= Math.min(streamLen, 0.3); t += 0.01) {
          const x = startX + (endX - startX) * t;
          const baseY = startY + (endY - startY) * t * t;
          if (t === 0) ctx.moveTo(x, baseY);
          else ctx.lineTo(x, baseY);
        }
        ctx.stroke();

        if (pourProgress > 0.9) {
          for (let i = 0; i < 10; i++) {
            const splashX = endX + Math.sin(frame * 0.2 + i * 1.1) * 25;
            const splashY = endY + Math.abs(Math.cos(frame * 0.15 + i * 1.5)) * 20;
            const r = 4 + Math.random() * 4;
            ctx.beginPath();
            ctx.arc(splashX, splashY, r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(245, 239, 232, 0.7)';
            ctx.fill();
          }
        }
      }

      ctx.restore();

      drawMilkCarton();
    }

    // --- Green straw ---
    const STRAW_COLOR_OUTSIDE = '#1a6b4a';
    const STRAW_COLOR_INSIDE = '#5aab7a';

    function drawStraw() {
      ctx.save();

      const strawBottomX = CUP_CENTER_X - 10;
      const strawBottomY = CUP_BOTTOM_Y - 30;
      const strawTopX = CUP_CENTER_X - 80;
      const strawTopY = CUP_TOP_Y - 100;

      const totalDX = strawTopX - strawBottomX;
      const totalDY = strawTopY - strawBottomY;
      const rimT = (CUP_TOP_Y - strawBottomY) / totalDY;
      const rimX = strawBottomX + totalDX * rimT;
      const rimY = CUP_TOP_Y;

      ctx.strokeStyle = STRAW_COLOR_INSIDE;
      ctx.lineWidth = 15;
      ctx.lineCap = 'butt';
      ctx.beginPath();
      ctx.moveTo(strawBottomX, strawBottomY);
      ctx.lineTo(rimX, rimY);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(strawBottomX + 4, strawBottomY);
      ctx.lineTo(rimX + 4, rimY);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(0,0,0,0.1)';
      ctx.lineWidth = 18;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(rimX + 2, rimY + 2);
      ctx.lineTo(strawTopX + 2, strawTopY + 2);
      ctx.stroke();

      ctx.strokeStyle = STRAW_COLOR_OUTSIDE;
      ctx.lineWidth = 15;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(rimX, rimY);
      ctx.lineTo(strawTopX, strawTopY);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(rimX + 4, rimY);
      ctx.lineTo(strawTopX + 4, strawTopY);
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(strawTopX, strawTopY, 8, 4, -0.4, 0, Math.PI * 2);
      ctx.fillStyle = '#0d4a30';
      ctx.fill();

      ctx.restore();
    }

    // --- Shadow under cup ---
    function drawShadow() {
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(CUP_CENTER_X, BASE_BOTTOM_Y + 8, CUP_WIDTH_BASE + 30, 10, 0, 0, Math.PI * 2);
      const grad = ctx.createRadialGradient(CUP_CENTER_X, BASE_BOTTOM_Y + 8, 0, CUP_CENTER_X, BASE_BOTTOM_Y + 8, CUP_WIDTH_BASE + 30);
      grad.addColorStop(0, 'rgba(0,0,0,0.2)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.restore();
    }

    // --- Background ---
    function drawBackground() {
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#d6eaf8');
      grad.addColorStop(1, '#b9d9f0');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      ctx.beginPath();
      ctx.moveTo(0, BASE_BOTTOM_Y + 20);
      ctx.lineTo(W, BASE_BOTTOM_Y + 20);
      ctx.strokeStyle = 'rgba(0,0,0,0.08)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // --- State machine ---
    function updateState() {
      frame++;
      stateTimer++;

      switch (state) {
        case STATE.WAIT_START:
          if (stateTimer > 80) {
            state = STATE.POURING;
            stateTimer = 0;
            pourProgress = 0;
          }
          break;

        case STATE.POURING:
          pouringStarted = true;
          if (pourProgress < 1) {
            pourProgress = Math.min(1, pourProgress + 0.015);
          }
          if (pourProgress >= 0.9) {
            fillLevel = Math.min(1, fillLevel + FILL_SPEED);
          }
          if (fillLevel >= 1) {
            state = STATE.SETTLING;
            stateTimer = 0;
          }
          break;

        case STATE.SETTLING:
          pourProgress = Math.max(0, pourProgress - 0.03);
          if (stateTimer > 80) {
            state = STATE.WAIT_END;
            stateTimer = 0;
          }
          break;

        case STATE.WAIT_END:
          if (stateTimer > 100) {
            state = STATE.RESETTING;
            stateTimer = 0;
          }
          break;

        case STATE.RESETTING:
          fillLevel = Math.max(0, fillLevel - RESET_SPEED);
          if (fillLevel <= 0) {
            fillLevel = 0;
            pouringStarted = false;
            state = STATE.WAIT_START;
            stateTimer = 0;
          }
          break;
      }
    }

    // --- Main draw ---
    function draw() {
      updateState();
      ctx.clearRect(0, 0, W, H);

      drawBackground();
      drawShadow();

      // Liquid inside (drawn first, clipped to cup shape)
      drawLiquid();

      // Ice cubes (clipped to cup)
      ctx.save();
      drawCupClipPath();
      ctx.clip();
      iceCubes.forEach(drawIceCube);
      ctx.restore();

      // Cup image on top with multiply blend mode
      // (black outlines show, white areas let liquid through)
      drawCupImage();

      // Straw
      drawStraw();

      // Milk stream (on top of everything)
      drawMilkStream();

      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
